; Limites para importar/restaurar backups .mbz grandes (~1,6 GB)
memory_limit = 1024M
max_input_vars = 5000
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 1800
max_input_time = 1800
default_socket_timeout = 1800
; uploads temporários vão para o volume de dados (evita encher a camada do contêiner)
upload_tmp_dir = /var/www/moodledata/phptmp
date.timezone = America/Sao_Paulo

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
opcache.enable_cli = 0
