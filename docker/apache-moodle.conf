# Uploads grandes (.mbz de ~1,6 GB): sem limite de corpo e timeout de 30 min
Timeout 1800
LimitRequestBody 0

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    # A partir do Moodle 5.1 o webroot é a pasta public/
    DocumentRoot /var/www/moodle/public

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        AcceptPathInfo On
        DirectoryIndex index.php
        LimitRequestBody 0
        # Router do Moodle (permite URLs sem r.php)
        FallbackResource /r.php
    </Directory>

    # Coolify/Traefik termina o HTTPS e repassa em HTTP
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
